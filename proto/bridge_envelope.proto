syntax = "proto3";

package mq.bridge;

import "bridge_config.proto";

// BridgeEnvelope 是 bridge 写入 MQ 消息体的稳定封装。
//
// broker 把 body 当作不透明字节，不解析 cdr，也不依赖 ROS2 类型。
// 字段一旦发布就应保持向后兼容：只增字段、不改变既有字段含义。
//
// 版本与兼容性：
// - version 从 1 开始；未知/未来版本必须拒绝，不能猜测解析；
// - 新增可选字段可以保持旧版本可读，但不能复用已有 tag；
// - cdr 是 ROS2 序列化后的原始字节（通常包含 CDR encapsulation），
//   bridge 只搬运，不解释其中的消息类型。
message BridgeEnvelope {
    uint32 version = 1;              // 从 1 开始
    string topic = 2;                // ROS2 topic 名
    string ros_type = 3;             // 例如 sensor_msgs/msg/Imu
    uint64 stamp_ns = 4;             // bridge 接收/生成时间，Unix epoch 纳秒
    bytes cdr = 5;                   // ROS2 序列化后的 CDR 字节
    string source = 6;               // 来源标识，便于排查
    string correlation_id = 7;       // 关联 id / 去重键
    BridgeReliability reliability = 8;
    BridgeDurability durability = 9;
    uint32 depth = 10;               // 建议的 ROS2 history depth
    map<string, string> headers = 11; // frame_id、机器人 id 等扩展信息
}

// retained store 的可选持久化格式。它只由 bridge 读写。
message RetainedRecord {
    string topic = 1;
    bytes envelope = 2;              // 序列化后的 BridgeEnvelope
    uint64 updated_ms = 3;           // Unix epoch 毫秒
}

message RetainedState {
    repeated RetainedRecord records = 1;
}
