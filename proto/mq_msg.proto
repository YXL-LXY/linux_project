syntax = "proto3";
package mq;

enum ExchangeType {
    UNKNOWTYPE = 0;
    DIRECT = 1; //直接交换
    FANOUT = 2; //广播交换
    TOPIC = 3; //主题交换
};

enum DeliveryMode {
    UNKNOWMODE = 0;
    UNDURABLE = 1;
    DURABLE = 2;
};

message BasicProperties{
    string id = 1;
    DeliveryMode delivery_mode = 2;//持久化模式 1-非持久化； 2-持久化
    string routing_key = 3;
    uint32 delivery_count = 4;//该消息被投递的次数，用于失败重投/死信判断
};

message Message {
    message Payload {
        BasicProperties properties = 1; //消息属性
        string body = 2;
        string valid = 3; //是否有效
    };
    Payload payload = 1; //有效载荷
    uint32 offset = 2; //偏移量
    uint32 length = 3;
};